<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自然地形生成プレビュー</title>
  <style>
    :root { color-scheme: dark; font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif; background: #10191a; color: #e6e0ca; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0, #293637, #10191a 58%); }
    main { width: min(1500px, 96vw); margin: 0 auto; padding: 28px 0 48px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
    h1 { margin: 0; font: 600 clamp(22px, 3vw, 38px)/1.1 Georgia, "Yu Mincho", serif; letter-spacing: .05em; }
    header p { margin: 8px 0 0; color: #aebbb5; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 13px; border: 1px solid #61706b66; background: #182324d9; box-shadow: 0 14px 38px #0007; }
    label { display: grid; gap: 5px; color: #b9c5be; font-size: 12px; letter-spacing: .08em; }
    input { width: 148px; padding: 9px 10px; border: 1px solid #67746e; background: #0e1718; color: #f1ead2; }
    input[type="range"] { padding: 0; }
    button { padding: 10px 18px; border: 1px solid #d0bb7b; background: #8e7336; color: #fff8e3; font-weight: 700; cursor: pointer; }
    .map-frame { position: relative; overflow: hidden; border: 1px solid #82795f; background: #0b2731; box-shadow: 0 24px 80px #000b; }
    #terrainImage { display: block; width: 100%; aspect-ratio: 3 / 2; }
    #terrainImage svg { display: block; width: 100%; height: 100%; }
    .facts { display: flex; flex-wrap: wrap; gap: 8px; padding: 11px 13px; border-top: 1px solid #726b56; background: #111a1bdd; }
    .facts span { padding: 5px 9px; background: #283434; color: #d8d3bf; font-size: 12px; }
    @media (max-width: 760px) { header { align-items: stretch; flex-direction: column; } .controls { width: 100%; } #terrainImage { aspect-ratio: auto; min-height: 440px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>自然地形生成</h1><p>四角タイルの数値モデルを、文字記号を使わず連続地形画像へ合成します。</p></div>
      <div class="controls">
        <label>世界シード<input id="seed" value="eldoria-317"></label>
        <label>降水量<input id="rainfall" type="range" min="0.5" max="1.5" step="0.05" value="1"></label>
        <label>地形年代<input id="worldAge" type="range" min="0" max="1" step="0.05" value="0.58"></label>
        <button id="generate" type="button">再生成</button>
      </div>
    </header>
    <section class="map-frame" aria-live="polite">
      <div id="terrainImage"></div>
      <div class="facts" id="facts"></div>
    </section>
  </main>
  <script type="module">
    import { generateTerrain } from "./src/terrain-generation.js";
    import { renderTerrainSvg } from "./src/terrain-renderer.js";

    const seed = document.querySelector("#seed");
    const rainfall = document.querySelector("#rainfall");
    const worldAge = document.querySelector("#worldAge");
    const image = document.querySelector("#terrainImage");
    const facts = document.querySelector("#facts");

    function render() {
      const world = generateTerrain({ seed: seed.value || "eldoria-317", rainfall: Number(rainfall.value), worldAge: Number(worldAge.value) });
      image.innerHTML = renderTerrainSvg(world, { cellSize: 18, showGrid: true });
      facts.innerHTML = [
        `格子 ${world.gridType === "square" ? "四角" : world.gridType}`,
        `陸地 ${Math.round(world.summary.landRatio * 100)}%`,
        `陸塊 ${world.summary.landmassCount}`,
        `水系 ${world.summary.riverCount}`,
        `平均降水 ${world.summary.meanPrecipitationMm} mm`,
        `平均肥沃度 ${world.summary.meanFertility}`,
      ].map((value) => `<span>${value}</span>`).join("");
    }

    document.querySelector("#generate").addEventListener("click", render);
    render();
  </script>
</body>
</html>
