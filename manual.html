<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#203b3b" />
    <title>『誓界記』ゲームマニュアル</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #25322f;
        --muted: #6e7068;
        --paper: #eee5d1;
        --paper-deep: #d8c9aa;
        --teal: #345b54;
        --gold: #9b7939;
        --line: rgba(74, 61, 40, 0.2);
        font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", Georgia, serif;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; color: var(--ink); background: #172729; }
      a { color: inherit; }

      .manual-header {
        position: relative;
        padding: clamp(32px, 7vw, 82px) max(24px, calc((100vw - 1120px) / 2));
        color: #f3e7c8;
        border-bottom: 1px solid #b38f49;
        background:
          radial-gradient(circle at 78% 30%, rgba(205, 170, 86, 0.18), transparent 26%),
          linear-gradient(118deg, #1d3d3b, #2b312e 70%);
      }

      .manual-header small { color: #d7b967; font: 800 10px/1 system-ui, sans-serif; letter-spacing: 0.18em; }
      .manual-header h1 { max-width: 820px; margin: 12px 0 8px; font-size: clamp(30px, 5vw, 55px); line-height: 1.2; }
      .manual-header p { max-width: 720px; margin: 0; color: #bdc9c2; font: 13px/1.8 system-ui, sans-serif; }
      .manual-header a { position: absolute; top: 22px; right: max(24px, calc((100vw - 1120px) / 2)); padding: 9px 13px; border: 1px solid rgba(230, 206, 146, 0.35); font: 800 11px/1 system-ui, sans-serif; text-decoration: none; }
      .manual-header a:hover { color: #243a36; background: #ead9b2; }

      .manual-shell { width: min(1120px, calc(100% - 32px)); display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 26px; margin: 28px auto 70px; }
      .manual-toc { position: sticky; top: 18px; align-self: start; max-height: calc(100vh - 36px); overflow-y: auto; padding: 17px; border: 1px solid rgba(222, 197, 136, 0.22); color: #d6d7ca; background: #203235; }
      .manual-toc strong { display: block; padding-bottom: 10px; color: #e5c97d; font: 800 9px/1 system-ui, sans-serif; letter-spacing: 0.15em; }
      .manual-toc a { display: block; padding: 7px 5px; border-top: 1px solid rgba(231, 215, 174, 0.09); color: #bec9c4; font: 10px/1.45 system-ui, sans-serif; text-decoration: none; }
      .manual-toc a:hover { color: #f3dfaa; background: rgba(255, 255, 255, 0.04); }

      .manual-paper { min-width: 0; padding: clamp(24px, 5vw, 58px); border: 1px solid #b18d48; background: var(--paper); box-shadow: 0 22px 70px rgba(0, 0, 0, 0.38); }
      .manual-paper > h1:first-child { display: none; }
      .manual-paper h2 { margin: 2.4em 0 0.7em; padding: 0 0 9px; border-bottom: 1px solid var(--line); color: #294b46; font-size: clamp(21px, 3vw, 28px); scroll-margin-top: 18px; }
      .manual-paper h2:first-of-type { margin-top: 0; }
      .manual-paper h3 { margin: 1.7em 0 0.55em; color: #755b2c; font-size: 17px; scroll-margin-top: 18px; }
      .manual-paper p, .manual-paper li { color: #4f544f; font: 13px/1.9 system-ui, sans-serif; }
      .manual-paper p { margin: 0.6em 0 1em; }
      .manual-paper ul, .manual-paper ol { margin: 0.7em 0 1.3em; padding-left: 1.55em; }
      .manual-paper li + li { margin-top: 0.3em; }
      .manual-paper strong { color: #2f4c45; }
      .manual-paper code { padding: 0.12em 0.35em; border: 1px solid rgba(76, 65, 45, 0.14); color: #6e5224; background: rgba(255, 255, 255, 0.45); font: 0.9em/1.4 ui-monospace, Consolas, monospace; }
      .manual-paper pre { overflow-x: auto; padding: 15px; border-left: 4px solid var(--gold); color: #dce2da; background: #223334; }
      .manual-paper pre code { padding: 0; border: 0; color: inherit; background: transparent; }
      .manual-paper table { width: 100%; margin: 1em 0 1.6em; border-collapse: collapse; font: 12px/1.65 system-ui, sans-serif; }
      .manual-paper th, .manual-paper td { padding: 9px 11px; border: 1px solid rgba(79, 64, 39, 0.18); text-align: left; vertical-align: top; }
      .manual-paper th { color: #f1e4c4; background: #36554f; }
      .manual-paper tr:nth-child(even) td { background: rgba(255, 255, 255, 0.24); }
      .manual-error { padding: 18px; border-left: 4px solid #9b4c43; color: #713b34; background: #ead6ca; }

      @media (max-width: 780px) {
        .manual-header a { position: static; display: inline-block; margin-bottom: 22px; }
        .manual-shell { grid-template-columns: 1fr; width: min(100% - 20px, 720px); margin-top: 10px; }
        .manual-toc { position: static; max-height: none; }
        .manual-paper { padding: 24px 18px; }
        .manual-paper table { display: block; overflow-x: auto; white-space: nowrap; }
      }
    </style>
  </head>
  <body>
    <header class="manual-header">
      <a href="./index.html">← ゲームへ戻る</a>
      <small>PLAYER MANUAL / OATHBOUND CHRONICLE</small>
      <h1>セレナ王国 統治要覧</h1>
      <p>月次の進め方から都市運営、限定戦争、他国家の国家論理モデルまでをまとめた完全版マニュアルです。</p>
    </header>
    <div class="manual-shell">
      <nav class="manual-toc" id="manualToc" aria-label="目次"><strong>CONTENTS / 目次</strong></nav>
      <main class="manual-paper" id="manualPaper" aria-live="polite"><p>マニュアルを読み込んでいます……</p></main>
    </div>
    <script>
      const escapeHtml = (value) => value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");

      function inline(value) {
        return escapeHtml(value)
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }

      function headingId(value, index) {
        const slug = value.replace(/[『』「」【】]/g, "").replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").toLowerCase();
        return `${slug || "section"}-${index}`;
      }

      function renderMarkdown(source) {
        const lines = source.replace(/\r\n?/g, "\n").split("\n");
        const output = [];
        const headings = [];
        let index = 0;
        let list = null;

        const closeList = () => {
          if (!list) return;
          output.push(`</${list}>`);
          list = null;
        };

        while (index < lines.length) {
          const line = lines[index];

          if (line.startsWith("```")) {
            closeList();
            const language = line.slice(3).trim();
            const code = [];
            index += 1;
            while (index < lines.length && !lines[index].startsWith("```")) code.push(lines[index++]);
            output.push(`<pre><code data-language="${escapeHtml(language)}">${escapeHtml(code.join("\n"))}</code></pre>`);
            index += 1;
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeList();
            const level = heading[1].length;
            const label = heading[2];
            const id = headingId(label, headings.length + 1);
            output.push(`<h${level} id="${id}">${inline(label)}</h${level}>`);
            if (level === 2) headings.push({ id, label: label.replace(/^\d+\.\s*/, "") });
            index += 1;
            continue;
          }

          if (line.includes("|") && lines[index + 1]?.match(/^\|?[\s:|-]+\|/)) {
            closeList();
            const rows = [];
            while (index < lines.length && lines[index].includes("|") && lines[index].trim()) rows.push(lines[index++]);
            const cells = rows.map((row) => row.trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim()));
            const body = cells.filter((_, rowIndex) => rowIndex !== 1);
            output.push("<table>");
            body.forEach((row, rowIndex) => {
              const tag = rowIndex === 0 ? "th" : "td";
              output.push(`<tr>${row.map((cell) => `<${tag}>${inline(cell)}</${tag}>`).join("")}</tr>`);
            });
            output.push("</table>");
            continue;
          }

          const unordered = line.match(/^[-*]\s+(.+)$/);
          const ordered = line.match(/^\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            const nextList = unordered ? "ul" : "ol";
            if (list !== nextList) { closeList(); list = nextList; output.push(`<${list}>`); }
            output.push(`<li>${inline((unordered || ordered)[1])}</li>`);
            index += 1;
            continue;
          }

          closeList();
          if (line.trim()) output.push(`<p>${inline(line.trim())}</p>`);
          index += 1;
        }

        closeList();
        return { html: output.join("\n"), headings };
      }

      async function loadManual() {
        const paper = document.querySelector("#manualPaper");
        try {
          const response = await fetch("./MANUAL.md", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const bytes = await response.arrayBuffer();
          const source = new TextDecoder("utf-8").decode(bytes);
          const rendered = renderMarkdown(source);
          paper.innerHTML = rendered.html;
          const toc = document.querySelector("#manualToc");
          rendered.headings.forEach(({ id, label }) => {
            const link = document.createElement("a");
            link.href = `#${id}`;
            link.textContent = label;
            toc.append(link);
          });
        } catch (error) {
          paper.innerHTML = `<p class="manual-error">マニュアルを読み込めませんでした。${escapeHtml(error.message)}</p>`;
        }
      }

      loadManual();
    </script>
  </body>
</html>
